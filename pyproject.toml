[project]
name = "mapfree-refine"
version = "0.1.0"
description = "Training-free geometric refinement for map-free visual relocalization on the Niantic benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mapfree_refine*"]